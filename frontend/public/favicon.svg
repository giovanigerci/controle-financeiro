<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0B0F14"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#2A323D" stroke-width="0.75"/>
  <!-- Moeda circular -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#C9A24B" stroke-width="0.5" opacity="0.4"/>
  <!-- Cifrão $ -->
  <text x="16" y="21" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14" fill="#C9A24B">$</text>
  <!-- Linha vertical do cifrão -->
  <line x1="16" y1="5.5" x2="16" y2="8" stroke="#C9A24B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="24" x2="16" y2="26.5" stroke="#C9A24B" stroke-width="1.2" stroke-linecap="round"/>
</svg>